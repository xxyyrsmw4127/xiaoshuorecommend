core_preferences:
  real_intelligence_standard: "【2026-09-30 用户系统论述，本档案最重要的判据之一】用户认为'智力'在叙事中只有四种真实形态可被兑现：①阳谋——靠政治手腕；②阴谋——靠政治手腕、军事奇才，或完全突破道德底线的灵光一现；③军事指挥才能；④真实的专业能力。而'智斗'标签所承诺的'智力对决'，在实际写法和历史现实中都不存在对应物（'历史上谋士对决会有人称为智斗吗'）。因此：用户接受力量、接受狠辣、接受政治与军事的真实博弈、接受专业能力碾压；用户不接受把'聪明'本身当作看点来表演。"
  protagonist: "【最高优先级，2026-09-30 强化】主角必须性格鲜明、有强烈能动性、决断力外显。用户原话：'我本来就喜欢主角性格鲜明，人物矛盾冲突快，主线明确的网文'。反面是'优柔寡断''跟个npc似的，我根本不想去看主角在想什么'（评乌贼主角）。可以自私、可以黑暗、可以杀伐果断（方源为正面标杆），但不能有莫名的优越感、不能虚伪、不能双标。反对'逆成长'——主角的能力与心性必须随经历递增。"
  pacing: "【硬约束，2026-09-30 升级】节奏必须快、主线必须明确、冲突必须密集。用户原话：'人物矛盾冲突快，主线明确'。'磨叽'是直接否决词（《诡秘之主》《一世之尊》皆因此出局）。'铺垫型'写作不可接受，哪怕公认是神作——不要用'后面就好看了'作为推荐理由。"
  opening: "【2026-09-30 用户明确，此前的关键盲区】开局必须有即时的生存危机或强钩子，且设定本身就有吸引力。用户原话：'我喜欢开局设定就很吸引节奏快，最好开局主角就有生存危机的'。此条解释了用户前几轮的多项否决：《灭运图录》墨迹、《狂仙》太古早、《一品修仙》叽里咕噜水文——都是开局没抓住他。对照三个直接验证过的正面样本：《修仙就是这样子的》（用户评'节奏快，轻松娱乐，剧情还行，非常不错'）、《神秘复苏》（灵异复苏+杀人规律，开局即生死）、《永生》（修炼体系设定本身即钩子）。操作规则：推荐前必须确认该书的开局形态，优先选择'开局即濒死/被追杀/身陷绝境'或'开局设定自带强钩子'的作品；绝不用"熬过前几十章就好了"作为推荐理由。";
  tone: "偏黑暗、压抑、绝境，但绝境中必须有光——要有真实的合作与牺牲的正当性；拒绝纯粹的人性本恶展览。"
  focus: "剧情推进与矛盾冲突 > 主角性格张力 > 世界观与思想内核 > 爽点密度。核心诉求是'有哲学野心的爽文'，但爽先于野心。"
  free_text: "【最难满足的一组约束】用户同时要求：①恐怖/末世的黑暗氛围；②不虚无、不人性本恶的思想底色；③宏大世界观与哲学（佛道）深度；④爽点密集不憋屈、节奏快不磨叽。这四者在恐怖末世品类里天然冲突，是本档案最重要的筛选条件。恐怖小说被用户明确视为'作者潜意识的极端放大'——因此考察作者本人的思想水平是必要步骤，不是过度解读。"
  causality_stance: "【最重要的隐藏判据，2026-09-30 新增】用户判断一本书的核心，是看作者如何看待世界的因果规律：是把它当作需要理解与顺应的大道，还是当作可以用咒语欺骗、索取、耍赖绕过的对象。后一种被用户称为'咒语思维/女频娇纵逻辑'，其本质是：把'跟父母要钱'当咒语，咒语失效就怨恨父母，咒语成功则认为全是咒语的威能——即从不承认世界有自己的规律。用户对《永生》的认同一半落在这里：'天之道损有余而补不足'是规律，'人之道损不足以奉有余'是需要被正视的现实，而'人的智慧无穷无尽，只不过被因缘际会遮蔽了'是把遮蔽当作可破除的对象。此判据同时解释了用户为何厌弃《地狱公寓》（把一切归于人性）与《玄鉴仙族》（女巫驱动/咒语驱动）。"
  drop_behavior: "【操作规则，非口味】用户在某个节点中断一本书后，基本不会捡回来再听——哪怕作者是梦入神机。因此：①不要推荐用户已中断的书或其续作；②推荐时不要用'你再坚持读下去就好了'作为理由；③若一本长书前段体验不佳，用户直接终局，没有第二次机会。"

